[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-surface"
version = "0.1.0"
description = "SABR and SVI volatility surface calibration for commodity derivatives"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Loup Moulin" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "yfinance>=0.2.30"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "ipykernel>=6.25.0"
]
